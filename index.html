<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>灵感笔记 - 捕捉每一个创意火花</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-wrapper">
        <nav class="sidebar">
            <div class="logo">
                <div class="logo-icon">✦</div>
                <h1>灵感笔记</h1>
            </div>
            <div class="nav-menu">
                <a href="#" class="nav-item active">
                    <span class="nav-icon">📝</span>
                    <span>全部笔记</span>
                </a>
                <a href="#" class="nav-item">
                    <span class="nav-icon">⭐</span>
                    <span>收藏夹</span>
                </a>
                <a href="#" class="nav-item">
                    <span class="nav-icon">🏷️</span>
                    <span>标签</span>
                </a>
                <a href="#" class="nav-item">
                    <span class="nav-icon">🗑️</span>
                    <span>回收站</span>
                </a>
            </div>
            <div class="sidebar-footer">
                <p>灵感笔记 v2.0</p>
            </div>
        </nav>
        
        <main class="main-content">
            <header class="top-bar">
                <div class="search-box">
                    <input type="text" placeholder="搜索笔记..." id="searchInput">
                </div>
                <div class="user-info">
                    <span>👤 用户</span>
                </div>
            </header>
            
            <div class="content-area">
                <div class="editor-card">
                    <div class="editor-header">
                        <h2>✨ 新建笔记</h2>
                        <p>记录此刻的想法与灵感</p>
                    </div>
                    <div class="editor-body">
                        <textarea id="content" placeholder="在这里写下你的想法..." rows="4"></textarea>
                        <div class="editor-toolbar">
                            <div class="file-input-wrapper">
                                <input type="file" id="image" accept="image/*">
                                <span class="file-name">📎 添加图片</span>
                            </div>
                            <button id="submit">
                                <span>发布笔记</span>
                                <span class="btn-icon">→</span>
                            </button>
                        </div>
                    </div>
                </div>
                
                <div class="notes-header">
                    <h3>📚 我的笔记</h3>
                    <span class="notes-count" id="notesCount">0 条笔记</span>
                </div>
                
                <div id="posts" class="notes-grid"></div>
            </div>
        </main>
    </div>
    
    <script src="js/app.js"></script>
</body>
</html>
